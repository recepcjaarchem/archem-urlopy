function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,day);}
function getHolidays(y){
  const e=easterDate(y);
  const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return{[f(new Date(y,0,1))]:"Nowy Rok",[f(new Date(y,0,6))]:"Trzech Kroli",[f(e)]:"Wielkanoc",[f(add(e,1))]:"Pn. Wielkanocny",[f(new Date(y,4,1))]:"Swieto Pracy",[f(new Date(y,4,3))]:"3 Maja",[f(add(e,49))]:"Zielone Swiatki",[f(add(e,60))]:"Boze Cialo",[f(new Date(y,7,15))]:"Wniebowziecie NMP",[f(new Date(y,10,1))]:"Wszyst. Swietych",[f(new Date(y,10,11))]:"Niepodleglosci",[f(new Date(y,11,25))]:"Boze Narodzenie",[f(new Date(y,11,26))]:"2. dzien BN"};
}
function dsStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

const fmtDate=s=>s?new Date(s).toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric"}):"";

const hasR=(u,r)=>getRoles(u).includes(r);

const isKadry=u=>hasR(u,"kadry");

function workdays(a,b){
  if(!a||!b)return 0;
  let c=0,d=new Date(a),e=new Date(b);
  const h={};
  for(let y=d.getFullYear();y<=e.getFullYear();y++)Object.assign(h,getHolidays(y));
  while(d<=e){const w=d.getDay(),ds=dsStr(d);if(w!==0&&w!==6&&!h[ds])c++;d.setDate(d.getDate()+1);}
  return c;
}
function fmtDur(r){
  if(r.hrs!=null){
    const m=r.mins||0;
    const dur=m>0?r.hrs+"g "+m+"min":r.hrs+"g";
    if(r.timeFrom&&r.timeTo)return r.timeFrom+" – "+r.timeTo+" ("+dur+")";
    return dur;
  }
  return r.days+" "+(r.days===1?"dzien":"dni");
}
function calcDeduct(r){if(r.hrs!=null)return(r.hrs+(r.mins||0)/60)/HPD;return r.days||0;}
function daysToHM(days){if(!days&&days!==0)return "0g";const tm=Math.round(days*HPD*60),h=Math.floor(tm/60),m=tm%60;return m>0?h+"g "+m+"min":h+"g";}
function toPartsHM(td){const tm=Math.round(td*HPD*60),d=Math.floor(tm/(HPD*60)),r=tm%(HPD*60),h=Math.floor(r/60),m=r%60;return{d,h,m};}
function fromPartsHM(d,h,m){return d+h/HPD+m/(HPD*60);}
function getMgrQueue(reqs,users,mgr){return reqs.filter(r=>r.status==="zlozony"&&(users.find(u=>u.id===r.userId)?.managerIds||[]).includes(mgr.id));}
function getMgrHist(reqs,users,mgr){return reqs.filter(r=>{if(!["odrzucony","do_kadr","zrealizowany","anulowany"].includes(r.status))return false;const sub=users.find(u=>u.id===r.userId);return r.mgrId===mgr.id||(sub?.managerIds||[]).includes(mgr.id);});}
function buildMailto(emails,subject,lines){const to=emails.filter(Boolean).join(",");if(!to)return null;return "mailto:"+to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.map(l=>l==null?"":l).join("\r\n"));}
function mailToMgr(req,emp,managers){const lt=getLT(req.type);const dur=req.hrs?req.hrs+"g":req.days+" dni";const subj="ARCHEM URLOPY - Wniosek: "+emp.name;return{href:buildMailto(managers.map(m=>m.email||""),subj,["Dzien dobry,","","Pracownik "+emp.name+" zlozyl/a wniosek.","","Rodzaj: "+(lt?lt.label:""),"Od: "+fmtDate(req.dateFrom)+"  Do: "+fmtDate(req.dateTo),"Czas: "+dur,req.reason?"Uzasadnienie: "+req.reason:null,"","System ARCHEM URLOPY"]),subj,to:managers.map(m=>m.name).join(", ")};}
function mailToKadry(req,emp,approver,klist){const lt=getLT(req.type);const dur=req.hrs?req.hrs+"g":req.days+" dni";const subj="ARCHEM URLOPY - Zatwierdzony wniosek: "+emp.name;return{href:buildMailto(klist.map(k=>k.email||""),subj,["Dzien dobry,","","Wniosek zatwierdzony.","","Pracownik: "+emp.name,"Rodzaj: "+(lt?lt.label:""),"Od: "+fmtDate(req.dateFrom)+"  Do: "+fmtDate(req.dateTo),"Czas: "+dur,"Zatwierdzil: "+approver.name,req.mgrCmt?"Komentarz: "+req.mgrCmt:null,"","System ARCHEM URLOPY"]),subj,to:klist.map(k=>k.name).join(", ")};}
function mailToEmp(req,emp,approver,approved){const lt=getLT(req.type);const dur=req.hrs?req.hrs+"g":req.days+" dni";const subj="ARCHEM URLOPY - Wniosek "+(approved?"ZATWIERDZONY":"ODRZUCONY");return{href:buildMailto([emp.email||""],subj,["Dzien dobry "+emp.name+",","","Twoj wniosek zostal "+(approved?"zatwierdzony.":"odrzucony."),"","Rodzaj: "+(lt?lt.label:""),"Od: "+fmtDate(req.dateFrom)+"  Do: "+fmtDate(req.dateTo),"Czas: "+dur,req.mgrCmt?"Komentarz: "+req.mgrCmt:null,"",approver.name+" / ARCHEM URLOPY"]),subj,to:emp.name};}

function defaultTab(u){if(isKadry(u))return "przekazane";if(isMgr(u))return "akceptacje";return "wnioski";}

// ─────────────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────────────
function App(){
  const [users,  setUsersS] =useState(DEFAULT_USERS);
  const [reqs,   setReqsS]  =useState(DEFAULT_REQS);
  const [lims,   setLimsS]  =useState(DEFAULT_LIMITS);
  const [notifs, setNotifsS]=useState([]);
  const [uwagi,  setUwagiS] =useState([]);
  const [loading,setLoad]   =useState(true);
  const [user,   setUser]   =useState(null);
  const [tab,    setTab]    =useState("wnioski");
  const [toast,  setToast]  =useState(null);
  const [mail,   setMail]   =useState(null);
  const [syncSt, setSyncSt] =useState("syncing");
  const ref=useRef({users:DEFAULT_USERS,reqs:DEFAULT_REQS,lims:DEFAULT_LIMITS,notifs:[],uwagi:[]});
  const lastSave=useRef(0);

  useEffect(()=>{
    if(!Cloud.ok()){
      const u=LS.get("users",DEFAULT_USERS),r=LS.get("reqs",DEFAULT_REQS),l=LS.get("lims",DEFAULT_LIMITS),n=LS.get("notifs",[]),w=LS.get("uwagi",[]);
      setUsersS(u);setReqsS(r);setLimsS(l);setNotifsS(n);setUwagiS(w);
      ref.current={users:u,reqs:r,lims:l,notifs:n,uwagi:w};setSyncSt("local");setLoad(false);return;
    }
    Cloud.load().then(data=>{
      if(data&&data.users&&Array.isArray(data.users)&&data.users.length>0){
        const lr=Array.isArray(data.reqs)?data.reqs:[];
        const ll=(data.lims&&typeof data.lims==="object")?data.lims:DEFAULT_LIMITS;
        const ln=Array.isArray(data.notifs)?data.notifs:[];
        const lw=Array.isArray(data.uwagi)?data.uwagi:[];
        setUsersS(data.users);setReqsS(lr);setLimsS(ll);setNotifsS(ln);setUwagiS(lw);
        ref.current={users:data.users,reqs:lr,lims:ll,notifs:ln,uwagi:lw};setSyncSt("ok");
      }else{
        const d0={users:DEFAULT_USERS,reqs:DEFAULT_REQS,lims:DEFAULT_LIMITS,notifs:[],uwagi:[]};
        ref.current=d0;setUsersS(d0.users);setReqsS(d0.reqs);setLimsS(d0.lims);setNotifsS(d0.notifs);setUwagiS(d0.uwagi);
        Cloud.save(d0).then(ok=>setSyncSt(ok?"ok":"error"));
      }
      setLoad(false);
    }).catch(()=>{
      const u=LS.get("users",DEFAULT_USERS),r=LS.get("reqs",DEFAULT_REQS),l=LS.get("lims",DEFAULT_LIMITS),n=LS.get("notifs",[]),w=LS.get("uwagi",[]);
      setUsersS(u);setReqsS(r);setLimsS(l);setNotifsS(n);setUwagiS(w);
      ref.current={users:u,reqs:r,lims:l,notifs:n,uwagi:w};setSyncSt("error");setLoad(false);
    });
  },[]);

  useEffect(()=>{
    if(!Cloud.ok()||!user)return;
    async function refresh(){
      if(Date.now()-lastSave.current<5000)return;
      try{
        const data=await Cloud.load();if(!data)return;
        const cr=Array.isArray(data.reqs)?data.reqs:[];const cu=Array.isArray(data.users)?data.users:ref.current.users;
        const cl=(data.lims&&typeof data.lims==="object")?data.lims:ref.current.lims;
        const cn=Array.isArray(data.notifs)?data.notifs:[];const cw=Array.isArray(data.uwagi)?data.uwagi:[];
        if(JSON.stringify(ref.current.reqs)!==JSON.stringify(cr)){setReqsS(cr);ref.current.reqs=cr;LS.set("reqs",cr);}
        if(JSON.stringify(ref.current.users)!==JSON.stringify(cu)){setUsersS(cu);ref.current.users=cu;LS.set("users",cu);}
        if(JSON.stringify(ref.current.lims)!==JSON.stringify(cl)){setLimsS(cl);ref.current.lims=cl;LS.set("lims",cl);}
        if(JSON.stringify(ref.current.notifs)!==JSON.stringify(cn)){setNotifsS(cn);ref.current.notifs=cn;LS.set("notifs",cn);}
        if(JSON.stringify(ref.current.uwagi)!==JSON.stringify(cw)){setUwagiS(cw);ref.current.uwagi=cw;LS.set("uwagi",cw);}
        setSyncSt("ok");
      }catch(e){}
    }
    const iv=setInterval(refresh,15000);
    return()=>clearInterval(iv);
  },[user]);

  function push(u,r,l,n,w){
    ref.current={users:u,reqs:r,lims:l,notifs:n,uwagi:w};
    LS.set("users",u);LS.set("reqs",r);LS.set("lims",l);LS.set("notifs",n);LS.set("uwagi",w);
    if(!Cloud.ok()){setSyncSt("local");return;}
    setSyncSt("syncing");lastSave.current=Date.now();
    Cloud.save({users:u,reqs:r,lims:l,notifs:n,uwagi:w}).then(ok=>{setSyncSt(ok?"ok":"error");if(ok)lastSave.current=Date.now();});
  }
  const setUsers=v=>{setUsersS(v);push(v,ref.current.reqs,ref.current.lims,ref.current.notifs,ref.current.uwagi);};
  const setReqs=v=>{setReqsS(v);push(ref.current.users,v,ref.current.lims,ref.current.notifs,ref.current.uwagi);};
  const setLims=v=>{setLimsS(v);push(ref.current.users,ref.current.reqs,v,ref.current.notifs,ref.current.uwagi);};
  const setNotifs=v=>{setNotifsS(v);push(ref.current.users,ref.current.reqs,ref.current.lims,v,ref.current.uwagi);};
  const setUwagi=v=>{setUwagiS(v);push(ref.current.users,ref.current.reqs,ref.current.lims,ref.current.notifs,v);};

  const notify=(msg,t)=>{setToast({msg,t:t||"ok"});setTimeout(()=>setToast(null),3000);};
  const patch=(upd,msg)=>{const nr=ref.current.reqs.map(r=>r.id===upd.id?upd:r);setReqs(nr);if(msg)notify(msg);};
  const delReq=rid=>{setReqs(ref.current.reqs.filter(r=>r.id!==rid));notify("Wpis usuniety");};

  const cancelLeave=req=>{
    const nr=ref.current.reqs.map(r=>r.id===req.id?{...req,status:"anulowany"}:r);setReqs(nr);notify("Urlop anulowany");
    const lt=getLT(req.type);
    if(lt&&ref.current.lims[req.userId]?.[req.type]){
      const nl=JSON.parse(JSON.stringify(ref.current.lims));
      nl[req.userId][req.type].used=Math.max(0,parseFloat(((nl[req.userId][req.type].used||0)-calcDeduct(req)).toFixed(4)));
      setLims(nl);
    }
  };

  function addNotif(userId,msg,reqId){
    const nn=[...ref.current.notifs,{id:"n"+Date.now(),userId,msg,reqId,read:false,createdAt:todayStr()}];
    setNotifsS(nn);push(ref.current.users,ref.current.reqs,ref.current.lims,nn,ref.current.uwagi);
  }

  function onReqSaved(req){
    const allU=ref.current.users;const emp=allU.find(u=>u.id===req.userId);
    const mgrs=(emp?.managerIds||[]).map(mid=>allU.find(u=>u.id===mid)).filter(Boolean);
    if(emp&&mgrs.length>0)setMail({items:[mailToMgr(req,emp,mgrs)],label:"Powiadom przelozonego"});
  }
  function onMgrDecision(req,approved){
    const allU=ref.current.users;const emp=allU.find(u=>u.id===req.userId);
    const kl=allU.filter(u=>isKadry(u));const items=[];
    if(approved&&emp&&kl.length>0)items.push(mailToKadry(req,emp,user,kl));
    if(emp)items.push(mailToEmp(req,emp,user,approved));
    if(items.length>0)setMail({items,label:approved?"Wyslij powiadomienia":"Powiadom pracownika"});
    // Odrzucony wniosek — zwrot dni do puli
    if(!approved){
      const lt=getLT(req.type);
      if(lt&&ref.current.lims[req.userId]?.[req.type]){
        const nl=JSON.parse(JSON.stringify(ref.current.lims));
        nl[req.userId][req.type].used=Math.max(0,parseFloat(((nl[req.userId][req.type].used||0)-calcDeduct(req)).toFixed(4)));
        setLims(nl);
      }
    }
    if(emp){
      const lt=getLT(req.type);
      const msg=approved

            setReqsS(nr);setLimsS(nl);push(ref.current.users,nr,nl,ref.current.notifs,ref.current.uwagi);

        {tab==="uwagi"&&<UwagiPanel user={user} users={users} uwagi={uwagi} onSubmit={submitUwaga} onMarkRead={markUwagiRead} onDelete={deleteUwaga}/>}

  );
}

// CAL PICKER
// ─────────────────────────────────────────────────────────────────────
function CalPicker({from,to,onSelect,single=false}){
  const now=new Date();
  const [yr,setYr]=useState(()=>from?new Date(from).getFullYear():now.getFullYear());
  const [mo,setMo]=useState(()=>from?new Date(from).getMonth():now.getMonth());
  const [hov,setHov]=useState(null);
  const first=new Date(yr,mo,1),total=new Date(yr,mo+1,0).getDate(),startDow=(first.getDay()+6)%7;
  const holidays=getHolidays(yr);
  const cells=[...Array(startDow).fill(null),...Array.from({length:total},(_,i)=>i+1)];
  const todS=todayStr();
  function ds(d){return yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  function click(d){
    const s=ds(d);if(s<todS)return;
    if(single){onSelect(s);return;}
    if(!from||(from&&to)){onSelect(s,null);}
    else{if(s<from)onSelect(s,from);else onSelect(from,s);}
  }
  function inRange(s){if(!from)return false;const end=to||hov;if(!end)return false;const lo=from<end?from:end,hi=from<end?end:from;return s>lo&&s<hi;}
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-3 select-none">
      <div className="flex items-center justify-between mb-2">
        <button onClick={()=>{if(mo===0){setYr(y=>y-1);setMo(11);}else setMo(m=>m-1);}} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500">◀</button>
        <span className="text-sm font-semibold text-slate-700">{MONTHS[mo]} {yr}</span>
        <button onClick={()=>{if(mo===11){setYr(y=>y+1);setMo(0);}else setMo(m=>m+1);}} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500">▶</button>
      </div>
      <div className="flex gap-3 mb-2 flex-wrap" style={{fontSize:"10px",color:"#94a3b8"}}>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded bg-red-100 border border-red-200"/>Swieto PL</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded bg-slate-100"/>Weekend</span>
      </div>
      <div className="grid grid-cols-7 gap-0.5 mb-1">
        {DOWS.map(d=><div key={d} style={{fontSize:"10px"}} className={"text-center py-0.5 font-semibold "+(d==="Sb"||d==="Nd"?"text-slate-300":"text-slate-400")}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map((d,i)=>{
          if(!d)return <div key={i}/>;
          const s=ds(d),dow=(startDow+d-1)%7,isWe=dow>=5,holiday=holidays[s],isPast=s<todS;
          const isFrom=s===from,isTo=s===to,inR=inRange(s),isToday=s===todS;
          let bg,txt,cur="cursor-pointer";
          if(isPast){bg="bg-white";txt="text-slate-200";cur="cursor-default";}
          else if(isFrom||isTo){bg="bg-blue-600";txt="text-white";}
          else if(inR){bg="bg-blue-100";txt="text-blue-700";}
          else if(holiday){bg="bg-red-50 hover:bg-red-100";txt="text-red-500";}
          else if(isWe){bg="bg-slate-50";txt="text-slate-300";}
          else{bg="bg-white hover:bg-blue-50";txt="text-slate-700";}
          return (
            <div key={i} title={holiday||""} className={`rounded border ${isToday&&!isFrom&&!isTo?"border-blue-300":"border-transparent"} ${bg} ${cur} p-0.5`}
              onClick={()=>click(d)} onMouseEnter={()=>!isPast&&!to&&from&&setHov(s)} onMouseLeave={()=>setHov(null)}>
              <div className={`text-center font-medium ${txt}`} style={{fontSize:"11px"}}>{d}</div>
              {holiday&&<div className="text-red-400 leading-tight truncate text-center" style={{fontSize:"7px"}}>{holiday.split(" ")[0]}</div>}
            </div>
          );
        })}
      </div>
      {!single&&from&&!to&&<div className="text-xs text-amber-500 text-center mt-2">▸ Kliknij date koncowa</div>}
      {!single&&from&&to&&<div className="text-xs text-blue-600 text-center mt-2 font-medium">{fmtDate(from)} → {fmtDate(to)} · <strong>{workdays(from,to)}</strong> dni roboczych</div>}
      {single&&from&&<div className="text-xs text-blue-600 text-center mt-2 font-medium">{fmtDate(from)}</div>}
    </div>
  );
}

function NewReq({user,lims,users,onSave}){
  const [type,setType]=useState("wypoczynkowy");
  const [unit,setUnit]=useState("days");
  const [from,setFrom]=useState("");const [to,setTo]=useState("");
  const [timeFrom,setTimeFrom]=useState("08:00");
  const [timeTo,setTimeTo]=useState("16:00");
  const [reason,setReason]=useState("");const [err,setErr]=useState("");
  const ul=lims[user.id]||{};const lt=getLT(type);
  const limEntry=ul[type]||{total:lt?.limit||0,used:0};
  const hasLimit=lt&&(lt.limit!=null||limEntry.total>0);
  const left=hasLimit?parseFloat((limEntry.total-limEntry.used).toFixed(4)):null;
  const days=(unit==="days"&&from&&to)?workdays(from,to):0;
  const tdRaw=(()=>{const [fh,fm]=timeFrom.split(":").map(Number);const [th,tm]=timeTo.split(":").map(Number);return(th*60+tm)-(fh*60+fm);})();
  const tdValid=tdRaw>0;
  const tdHrs=Math.floor(Math.max(0,tdRaw)/60);
  const tdMin=Math.max(0,tdRaw)%60;
  const equiv=unit==="hours"?(tdValid?(tdHrs+tdMin/60)/HPD:0):days;
  const over=left!==null&&left>0&&equiv>left;
  const managers=(user.managerIds||[]).map(mid=>users.find(u=>u.id===mid)).filter(Boolean);
  const HOURS=Array.from({length:13},(_,i)=>String(i+6).padStart(2,"0"));

  function submit(){
    setErr("");
    if(unit==="days"){if(!from){setErr("Wybierz date poczatkowa.");return;}if(!to){setErr("Wybierz date koncowa.");return;}if(days<=0){setErr("Brak roboczych dni w zakresie.");return;}}
    else{if(!from){setErr("Wybierz date.");return;}if(!tdValid){setErr("Godzina 'do' musi byc pozniej niz 'od'.");return;}}
    if(over){setErr("Przekracza limit (pozostalo: "+left.toFixed(2)+" dni / "+daysToHM(left)+").");return;}
    const base={id:"r"+Date.now(),userId:user.id,type,reason,status:initSt(user),createdAt:todayStr(),mgrCmt:"",mgrId:null};
    if(unit==="days")onSave({...base,dateFrom:from,dateTo:to,days,hrs:null,mins:null,timeFrom:null,timeTo:null});
    else onSave({...base,dateFrom:from,dateTo:from,days:null,hrs:tdHrs,mins:tdMin,timeFrom,timeTo});
  }

  return (
    <div className="max-w-lg">
      <div className="bg-white rounded-2xl p-6 border border-slate-200 space-y-4">
        <h2 className="text-sm font-semibold text-slate-700">Nowy wniosek urlopowy</h2>
        {managers.length>0&&<div className="bg-blue-50 border border-blue-200 rounded-xl px-3 py-2 text-xs text-blue-600">Po zlozeniu: powiadomienie e-mail do {managers.map(m=>m.name).join(", ")}</div>}
        <div className="space-y-1.5">
          {LEAVE_TYPES.map(l=>{
            const ll=ul[l.id]||{total:l.limit||0,used:0};const hL=l.limit!=null||ll.total>0;
            const lft=hL?parseFloat((ll.total-ll.used).toFixed(2)):null;
            return (
              <label key={l.id} className={"flex items-center gap-3 p-3 rounded-xl border cursor-pointer "+(type===l.id?"border-blue-500 bg-blue-50":"border-slate-200 hover:border-slate-300")}>
                <input type="radio" name="ltype" value={l.id} checked={type===l.id} onChange={()=>setType(l.id)} className="sr-only"/>
                <div className={"w-3 h-3 rounded-full flex-shrink-0 "+(type===l.id?"bg-blue-500":"bg-slate-300")}/>
                <span className="text-sm text-slate-700">{l.label}</span>
                {lft!==null&&<span className={"ml-auto text-xs px-2 py-0.5 rounded-full font-medium "+(lft>0?"bg-green-100 text-green-600":"bg-red-100 text-red-500")}>{lft} dni ({daysToHM(lft)})</span>}
              </label>
            );
          })}
        </div>
        <div className="flex gap-2">
          <button onClick={()=>setUnit("days")} className={"flex-1 py-2 text-sm font-medium rounded-lg border "+(unit==="days"?"border-blue-500 bg-blue-50 text-blue-600":"border-slate-200 text-slate-500")}>Pelne dni</button>
          <button onClick={()=>setUnit("hours")} className={"flex-1 py-2 text-sm font-medium rounded-lg border "+(unit==="hours"?"border-blue-500 bg-blue-50 text-blue-600":"border-slate-200 text-slate-500")}>Godziny</button>
        </div>
        {unit==="days"
          ? <CalPicker from={from} to={to} onSelect={(f,t)=>{setFrom(f||"");setTo(t||"");}}/>
          : (
            <div className="space-y-3">
              <CalPicker from={from} to={from} single onSelect={f=>setFrom(f||"")}/>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Od godziny</label>
                  <div className="flex gap-1">
                    <select value={timeFrom.split(":")[0]} onChange={e=>setTimeFrom(e.target.value+":"+timeFrom.split(":")[1])} className="flex-1 border border-slate-200 rounded-lg px-2 py-2 text-sm">
                      {HOURS.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                    <select value={timeFrom.split(":")[1]} onChange={e=>setTimeFrom(timeFrom.split(":")[0]+":"+e.target.value)} className="flex-1 border border-slate-200 rounded-lg px-2 py-2 text-sm">
                      {MINS_OPTS.map(m=><option key={m} value={String(m).padStart(2,"0")}>{String(m).padStart(2,"0")}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Do godziny</label>
                  <div className="flex gap-1">
                    <select value={timeTo.split(":")[0]} onChange={e=>setTimeTo(e.target.value+":"+timeTo.split(":")[1])} className="flex-1 border border-slate-200 rounded-lg px-2 py-2 text-sm">
                      {HOURS.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                    <select value={timeTo.split(":")[1]} onChange={e=>setTimeTo(timeTo.split(":")[0]+":"+e.target.value)} className="flex-1 border border-slate-200 rounded-lg px-2 py-2 text-sm">
                      {MINS_OPTS.map(m=><option key={m} value={String(m).padStart(2,"0")}>{String(m).padStart(2,"0")}</option>)}
                    </select>
                  </div>
                </div>
              </div>
              {tdValid
                ? <div className={"rounded-lg px-3 py-2 text-sm border font-medium "+(over?"bg-red-50 border-red-200 text-red-600":"bg-blue-50 border-blue-200 text-blue-700")}>
                    {timeFrom} – {timeTo} = {tdHrs}g{tdMin>0?" "+tdMin+"min":""} ({equiv.toFixed(2).replace(/\.?0+$/,"")} dnia){over?" · przekracza limit!":""}
                  </div>
                : <div className="rounded-lg px-3 py-1.5 text-xs border bg-amber-50 border-amber-200 text-amber-600">Godzina "do" musi byc pozniej niz "od"</div>
              }
            </div>
          )
        }
        {unit==="days"&&from&&to&&days>0&&<div className={"rounded-lg px-3 py-2 text-sm border "+(over?"bg-red-50 border-red-200 text-red-600":"bg-blue-50 border-blue-200 text-blue-700")}>{"Dni roboczych: "+days+" ("+daysToHM(days)+")"+(over?" - przekracza limit!":"")}</div>}
        <textarea value={reason} onChange={e=>setReason(e.target.value)} rows={2} placeholder="Uzasadnienie (opcjonalne)..." className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:border-blue-400"/>
        {err&&<div className="text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2">{err}</div>}
        <button onClick={submit} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition-colors">Zloz wniosek</button>
      </div>
    </div>
  );
}

function ApprovalPanel({user,reqs,users,patch,notify,onDecision}){

                <div key={req.id} className="bg-white rounded-xl p-4 border border-slate-200">

                    <Av u={sub} sz={36}/>

                      <div className="font-medium text-sm text-slate-700">{sub?.name} <span className="text-xs text-slate-400">({getRoles(sub).join("/")})</span></div>

                      {req.reason&&<div className="text-xs text-slate-400">{req.reason}</div>}
                    </div>
                  </div>
                  <input type="text" placeholder="Komentarz..." value={cmts[req.id]||""} onChange={e=>setCmts(c=>({...c,[req.id]:e.target.value}))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:border-blue-400"/>

                    <button onClick={()=>act(req,false)} className="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-2 rounded-lg">Odrzuc</button>

  const parts=evHM[ltId]?.[field]||{d:0,h:0,m:0};
  const set=upd=>setEvHM(x=>({...x,[ltId]:{...x[ltId],[field]:{...parts,...upd}}}));

    <div className="flex gap-1 items-end">
      <div><div className="text-xs text-slate-400 mb-0.5">dni</div><input type="number" min={0} max={365} value={parts.d} onChange={e=>set({d:+e.target.value})} className="w-14 border border-slate-200 rounded-lg px-2 py-1.5 text-sm text-center"/></div>
      <div><div className="text-xs text-slate-400 mb-0.5">godz</div><select value={parts.h} onChange={e=>set({h:+e.target.value})} className="w-14 border border-slate-200 rounded-lg px-1 py-1.5 text-sm">{Array.from({length:HPD},(_,i)=>i).map(h=><option key={h} value={h}>{h}g</option>)}</select></div>
      <div><div className="text-xs text-slate-400 mb-0.5">min</div><select value={parts.m} onChange={e=>set({m:+e.target.value})} className="w-16 border border-slate-200 rounded-lg px-1 py-1.5 text-sm">{MINS_OPTS.map(m=><option key={m} value={m}>{m}min</option>)}</select></div>

}

function ManagePanel({reqs,users,lims,onCancel,onSaveLims}){
  const [editing,setEditing]=useState(null);
  const [ev,setEv]=useState({});
  const [evHM,setEvHM]=useState({});
  const cancellable=reqs.filter(r=>["do_kadr","zrealizowany"].includes(r.status));
  const sortedUsers=[...users].sort(byLastName);

  function openEdit(uid){
    const base=JSON.parse(JSON.stringify(lims[uid]||mkLimits()));
    setEv(base);
    const hm={};
    HMIN_TYPES.forEach(t=>{const v=base[t]||{total:0,used:0};hm[t]={total:toPartsHM(v.total),used:toPartsHM(v.used)};});
    setEvHM(hm);setEditing(uid);
  }
  function saveEdit(){
    const finalEv={...ev};
    HMIN_TYPES.forEach(t=>{
      if(evHM[t]){const{total:tot,used:usd}=evHM[t];finalEv[t]={total:fromPartsHM(tot.d,tot.h,tot.m),used:fromPartsHM(usd.d,usd.h,usd.m)};}
    });
    onSaveLims({...lims,[editing]:finalEv});setEditing(null);
  }

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-sm font-semibold text-slate-600 mb-3">Limity urlopowe</h2>
        <div className="space-y-2">
          {sortedUsers.map(u=>{
            const ul=lims[u.id]||mkLimits();
            return (
              <div key={u.id} className="bg-white rounded-xl p-4 border border-slate-200">
                <div className="flex items-center gap-3 mb-2">
                  <Av u={u} sz={36}/>
                  <div className="flex-1"><div className="text-sm font-medium text-slate-700">{u.name}</div><div className="text-xs text-slate-400">{getRoles(u).join("/")} · {u.team}</div></div>
                  <button onClick={()=>openEdit(u.id)} className="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-500">Edytuj</button>
                </div>
                <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                  {LEAVE_TYPES.map(lt=>{
                    const lim=ul[lt.id]||{total:0,used:0};const left=parseFloat((lim.total-lim.used).toFixed(2));const inf=lim.total===0;
                    return (
                      <div key={lt.id} className="text-center">
                        <div className="text-xs text-slate-400 truncate">{lt.label.split(" ").pop()}</div>
                        <div className={"text-xs font-bold "+(inf?"text-slate-300":left===0?"text-red-500":left<=2?"text-amber-500":"text-slate-700")}>{inf?"inf":left+"d"}</div>
                        {!inf&&<div className="text-xs text-blue-500">{daysToHM(left)}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div>
        <h2 className="text-sm font-semibold text-slate-600 mb-3">Anulowanie urlopow <Badge n={cancellable.length}/></h2>
        {cancellable.length===0
          ? <Empty msg="Brak"/>
          : (
            <div className="space-y-2">
              {cancellable.map(r=>{
                const u=users.find(x=>x.id===r.userId);const st=ST[r.status];
                return (
                  <div key={r.id} className="bg-white rounded-xl p-4 border border-slate-200 flex items-center gap-3">
                    <Av u={u} sz={36}/>
                    <div className="flex-1"><div className="text-sm font-medium text-slate-700">{u?.name}</div><div className="text-xs text-slate-400">{getLT(r.type)?.label} · {fmtDur(r)}</div>{st&&<span className={"text-xs px-1.5 py-0.5 rounded-full "+st.cls}>{st.label}</span>}</div>
                    <button onClick={()=>onCancel(r)} className="text-xs px-3 py-1.5 border border-red-200 text-red-500 rounded-lg hover:bg-red-50 whitespace-nowrap">Anuluj</button>
                  </div>
                );
              })}
            </div>
          )
        }
      </div>
      {editing&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl" style={{maxHeight:"90vh",overflowY:"auto"}}>
            <h3 className="font-semibold text-slate-700 mb-1">Edytuj limity</h3>
            <p className="text-xs text-slate-400 mb-4">{users.find(u=>u.id===editing)?.name} · 0 = bez limitu</p>
            <div className="space-y-4 mb-5">
              {LEAVE_TYPES.map(lt=>{
                const isHM=HMIN_TYPES.includes(lt.id);
                if(isHM){
                  const tot=evHM[lt.id]?.total||{d:0,h:0,m:0};const usd=evHM[lt.id]?.used||{d:0,h:0,m:0};
                  const totalDays=fromPartsHM(tot.d,tot.h,tot.m);const usedDays=fromPartsHM(usd.d,usd.h,usd.m);
                  const left=Math.max(0,parseFloat((totalDays-usedDays).toFixed(4)));const inf=totalDays===0;
                  return (
                    <div key={lt.id} className="border border-blue-200 bg-blue-50 rounded-xl p-3">
                      <div className="flex items-center justify-between mb-2">
                        <label className="text-xs font-semibold text-blue-700">{lt.label}</label>
                        <div className="text-xs font-bold text-slate-700">{inf?"bez limitu":(left.toFixed(2)+"d ("+daysToHM(left)+")")}</div>
                      </div>
                      <div className="space-y-2">
                        <div><div className="text-xs text-slate-500 font-medium mb-1">Limit</div><HMLimitInput ltId={lt.id} field="total" evHM={evHM} setEvHM={setEvHM}/></div>
                        <div><div className="text-xs text-slate-500 font-medium mb-1">Uzyte</div><HMLimitInput ltId={lt.id} field="used" evHM={evHM} setEvHM={setEvHM}/></div>
                      </div>
                    </div>
                  );
                }
                const v=ev[lt.id]||{total:0,used:0};
                return (
                  <div key={lt.id}>
                    <label className="text-xs font-medium text-slate-500 block mb-1">{lt.label}</label>
                    <div className="flex gap-2 items-center">
                      <div className="flex-1"><div className="text-xs text-slate-400 mb-0.5">Limit (dni)</div><input type="number" min={0} max={365} value={v.total} onChange={e=>setEv(x=>({...x,[lt.id]:{...x[lt.id],total:+e.target.value}}))} className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm"/></div>
                      <div className="flex-1"><div className="text-xs text-slate-400 mb-0.5">Uzyte (dni)</div><input type="number" min={0} max={v.total||9999} value={v.used} onChange={e=>setEv(x=>({...x,[lt.id]:{...x[lt.id],used:+e.target.value}}))} className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm"/></div>
                      <div className="text-center pt-4 flex-shrink-0"><div className="text-xs text-slate-400">Zostalo</div><div className="text-sm font-bold">{v.total===0?"inf":Math.max(0,v.total-v.used)+"d"}</div><div className="text-xs text-blue-500">{v.total===0?"":daysToHM(Math.max(0,v.total-v.used))}</div></div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setEditing(null)} className="flex-1 border border-slate-200 text-slate-500 text-sm py-2.5 rounded-xl">Anuluj</button>
              <button onClick={saveEdit} className="flex-1 bg-blue-600 text-white text-sm py-2.5 rounded-xl">Zapisz</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// PEOPLE MANAGER
// ─────────────────────────────────────────────────────────────────────
function PeopleManager({users,lims,currentId,onAdd,onEdit,onDelete}){
  const [modal,setModal]=useState(null);const [fm,setFm]=useState({name:"",team:"",roles:["pracownik"],password:"",email:"",mids:["",""]});
  const [err,setErr]=useState("");const [confirm,setConfirm]=useState(null);const [showPw,setShowPw]=useState({});
  const potMgrs=users.filter(u=>getRoles(u).some(r=>["przelozony","zarzad","kadry","administrator"].includes(r)));
  function toggleRole(r){const cur=fm.roles;if(cur.includes(r)){if(cur.length>1)setFm(f=>({...f,roles:cur.filter(x=>x!==r)}));}else{if(cur.length<2)setFm(f=>({...f,roles:[...cur,r]}));}}
  function openAdd(){setFm({name:"",team:"",roles:["pracownik"],password:"",email:"",mids:["",""]});setErr("");setModal("add");}
  function openEditF(u){setFm({name:u.name,team:u.team,roles:getRoles(u),password:u.password||"",email:u.email||"",mids:[u.managerIds?.[0]||"",u.managerIds?.[1]||""]});setErr("");setModal(u);}
  function submit(){
    if(!fm.name.trim()){setErr("Podaj imie.");return;}if(!fm.team.trim()){setErr("Podaj dzial.");return;}
    if(modal==="add"&&!fm.password){setErr("Podaj haslo.");return;}
    const managerIds=fm.mids.filter(Boolean);
    if(modal==="add")onAdd({id:"u"+Date.now(),name:fm.name.trim(),team:fm.team.trim(),roles:fm.roles,password:fm.password,email:fm.email.trim(),initials:getInit(fm.name),color:pickClr(users),managerIds});
    else onEdit({...modal,name:fm.name.trim(),team:fm.team.trim(),roles:fm.roles,password:fm.password||modal.password||"",email:fm.email.trim(),initials:getInit(fm.name),managerIds});
    setModal(null);
  }
  const seen=new Set();
  const groups=["administrator","zarzad","przelozony","kadry","pracownik"].map(r=>({
    r,
    list:users.filter(u=>{if(seen.has(u.id)||!getRoles(u).includes(r))return false;seen.add(u.id);return true;}).sort(byLastName)
  })).filter(g=>g.list.length>0);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-sm font-semibold text-slate-600">Pracownicy <Badge n={users.length}/></h2>
        <button onClick={openAdd} className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-xl">+ Dodaj</button>
      </div>
      {groups.map(g=>(
        <div key={g.r} className="mb-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide mb-2">{g.r} ({g.list.length})</div>
          <div className="space-y-2">
            {g.list.map(u=>{
              const mgrs=(u.managerIds||[]).map(mid=>users.find(x=>x.id===mid)).filter(Boolean);
              return (
                <div key={u.id} className="bg-white rounded-xl p-4 border border-slate-200 flex items-center gap-3">
                  <Av u={u} sz={40}/>
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap items-center gap-1.5 text-sm font-medium text-slate-700">
                      {u.name}
                      {u.id===currentId&&<span className="text-xs bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded-full">Ty</span>}
                      {getRoles(u).length>1&&<span className="text-xs bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded-full">{getRoles(u).join("+")}</span>}
                    </div>
                    <div className="text-xs text-slate-400">{u.team}{mgrs.length?" · "+mgrs.map(m=>m.name).join(", "):""}</div>
                    {u.email&&<div className="text-xs text-blue-400">{u.email}</div>}
                    <div className="flex items-center gap-1 mt-0.5">
                      <span className="text-xs font-mono text-slate-300">{showPw[u.id]?u.password:"••••••"}</span>
                      <button onClick={()=>setShowPw(p=>({...p,[u.id]:!p[u.id]}))} className="text-xs text-slate-300 hover:text-slate-500 ml-1">{showPw[u.id]?"Ukryj":"Pokaz"}</button>
                    </div>
                  </div>
                  <div className="flex gap-1.5 flex-shrink-0">
                    <button onClick={()=>openEditF(u)} className="text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-500">Edytuj</button>
                    {u.id!==currentId&&<button onClick={()=>setConfirm(u)} className="text-xs px-2.5 py-1.5 border border-red-200 rounded-lg hover:bg-red-50 text-red-400">Usun</button>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {modal&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl" style={{maxHeight:"90vh",overflowY:"auto"}}>
            <h3 className="font-semibold text-slate-700 mb-4">{modal==="add"?"Dodaj pracownika":"Edytuj pracownika"}</h3>
            <div className="space-y-3">
              <FI label="Imie i nazwisko" val={fm.name} set={v=>setFm(f=>({...f,name:v}))} ph="np. Jan Kowalski"/>
              <FI label="Dzial" val={fm.team} set={v=>setFm(f=>({...f,team:v}))} ph="np. IT"/>
              <FI label="Email" val={fm.email} set={v=>setFm(f=>({...f,email:v}))} ph="jan@firma.pl"/>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1.5">Role (maks. 2)</label>
                <div className="grid grid-cols-3 gap-1.5">
                  {ROLE_DEFS.map(r=>{const sel=fm.roles.includes(r.id);const dis=!sel&&fm.roles.length>=2;return(<button key={r.id} onClick={()=>!dis&&toggleRole(r.id)} className={"p-2 rounded-lg border text-xs "+(sel?"border-blue-500 bg-blue-50 text-blue-700":dis?"border-slate-100 text-slate-300 cursor-default":"border-slate-200 text-slate-500")}>{r.l}</button>);})}
                </div>
              </div>
              {[0,1].map(i=>(
                <div key={i}>
                  <label className="text-xs font-medium text-slate-500 block mb-1.5">Przelozony {i+1}</label>
                  <select value={fm.mids[i]} onChange={e=>setFm(f=>({...f,mids:f.mids.map((v,j)=>j===i?e.target.value:v)}))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                    <option value="">-- brak --</option>
                    {potMgrs.filter(m=>m.id!==fm.mids[i===0?1:0]).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                  </select>
                </div>
              ))}
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1.5">{modal==="add"?"Haslo":"Nowe haslo (puste = bez zmian)"}</label>
                <input type="text" value={fm.password} onChange={e=>setFm(f=>({...f,password:e.target.value}))} placeholder={modal==="add"?"min. 4 znaki":"Pozostaw puste"} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/>
              </div>
              {err&&<div className="text-sm text-red-500 bg-red-50 rounded-lg px-3 py-2">{err}</div>}
            </div>
            <div className="flex gap-2 mt-5">
              <button onClick={()=>setModal(null)} className="flex-1 border border-slate-200 text-slate-500 text-sm font-medium py-2.5 rounded-xl">Anuluj</button>
              <button onClick={submit} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2.5 rounded-xl">{modal==="add"?"Dodaj":"Zapisz"}</button>
            </div>
          </div>
        </div>
      )}
      {confirm&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center">
            <h3 className="font-semibold text-slate-700 mb-1">Usun pracownika?</h3>
            <p className="text-sm text-slate-400 mb-5">{confirm.name}</p>
            <div className="flex gap-2">
              <button onClick={()=>setConfirm(null)} className="flex-1 border border-slate-200 text-slate-500 text-sm py-2.5 rounded-xl">Anuluj</button>
              <button onClick={()=>{onDelete(confirm.id);setConfirm(null);}} className="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm py-2.5 rounded-xl">Usun</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// ALL REQS
// ─────────────────────────────────────────────────────────────────────
function AllReqs({reqs,users,canDelete,onDelete}){
  const [f,setF]=useState("all");const [confirmId,setConfirmId]=useState(null);
  const shown=f==="all"?reqs:reqs.filter(r=>r.status===f);
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-sm font-semibold text-slate-600">Wszystkie wnioski <Badge n={reqs.length}/></h2>
        <select value={f} onChange={e=>setF(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-2 py-1.5">
          <option value="all">Wszystkie</option>
          {Object.entries(ST).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
        </select>
      </div>
      <div className="space-y-2">{shown.map(r=><RCard key={r.id} req={r} users={users} onDelete={canDelete?()=>setConfirmId(r.id):null}/>)}</div>
      {shown.length===0&&<Empty msg="Brak wnioskow"/>}
      {confirmId&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center">
            <h3 className="font-semibold text-slate-700 mb-1">Usunac wniosek?</h3>
            <p className="text-sm text-slate-400 mb-5">Tej operacji nie mozna cofnac.</p>
            <div className="flex gap-2">
              <button onClick={()=>setConfirmId(null)} className="flex-1 border border-slate-200 text-slate-500 text-sm py-2.5 rounded-xl">Anuluj</button>
              <button onClick={()=>{onDelete(confirmId);setConfirmId(null);}} className="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm py-2.5 rounded-xl">Usun</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// TEAM CALENDAR
// ─────────────────────────────────────────────────────────────────────
function TeamCal({reqs,users}){
  const now=new Date();const [yr,setYr]=useState(now.getFullYear());const [mo,setMo]=useState(now.getMonth());const [sel,setSel]=useState(null);
  const first=new Date(yr,mo,1),total=new Date(yr,mo+1,0).getDate(),startDow=(first.getDay()+6)%7;
  const approved=reqs.filter(r=>["do_kadr","zrealizowany"].includes(r.status));
  const cells=[...Array(startDow).fill(null),...Array.from({length:total},(_,i)=>i+1)];
  const holidays=getHolidays(yr);
  function getAbs(d){const ds=yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");return approved.filter(r=>r.dateFrom<=ds&&r.dateTo>=ds);}
  function clickDay(d){const ds=yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");setSel({ds,abs:getAbs(d),holiday:holidays[ds]});}
  return (
    <div>
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between mb-3">
          <button onClick={()=>{if(mo===0){setYr(y=>y-1);setMo(11);}else setMo(m=>m-1);}} className="p-2 hover:bg-slate-100 rounded-lg text-slate-500">&#9664;</button>
          <h2 className="font-semibold text-slate-700">{MONTHS[mo]} {yr}</h2>
          <button onClick={()=>{if(mo===11){setYr(y=>y+1);setMo(0);}else setMo(m=>m+1);}} className="p-2 hover:bg-slate-100 rounded-lg text-slate-500">&#9654;</button>
        </div>
        <div className="flex gap-3 mb-3 text-xs text-slate-400 flex-wrap">
          <div className="flex items-center gap-1"><div className="w-3 h-3 rounded bg-red-100 border border-red-300"/>Swieto</div>
          <div className="flex items-center gap-1"><div className="w-3 h-3 rounded bg-slate-100"/>Weekend</div>
          <div className="flex items-center gap-1"><div className="w-3 h-3 rounded bg-blue-100 border border-blue-200"/>Urlop</div>
          <span className="text-slate-300">· kliknij dzien aby zobaczyc szczegoly</span>
        </div>
        <div className="grid grid-cols-7 gap-0.5 mb-1">
          {DOWS.map(d=><div key={d} className={"text-center text-xs py-1 font-medium "+(d==="Sb"||d==="Nd"?"text-slate-300":"text-slate-400")}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-0.5">
          {cells.map((d,i)=>{
            if(!d)return <div key={i}/>;
            const ds=yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
            const abs=getAbs(d),dow=(startDow+d-1)%7,isWe=dow>=5,holiday=holidays[ds],isSelected=sel?.ds===ds;
            const bgCls=isSelected?"bg-blue-600 border-blue-600":holiday?"bg-red-50 border-red-200 hover:bg-red-100":isWe?"bg-slate-50 border-slate-100":abs.length>0?"bg-blue-50 border-blue-200 hover:bg-blue-100":"bg-white border-slate-100 hover:bg-slate-50";
            const txtCls=isSelected?"text-white":holiday?"text-red-600":isWe?"text-slate-300":"text-slate-500";
            return (
              <div key={i} onClick={()=>clickDay(d)} className={"min-h-16 p-1 rounded-lg border cursor-pointer transition-colors "+bgCls} title={holiday||""}>
                <div className={"text-xs font-medium mb-0.5 "+txtCls}>{d}</div>
                {holiday&&<div style={{fontSize:"8px"}} className={isSelected?"text-blue-100 font-medium leading-tight truncate":"text-red-500 font-medium leading-tight truncate"}>{holiday}</div>}
                {abs.slice(0,2).map(r=>{const u=users.find(u=>u.id===r.userId);return <div key={r.id} style={{background:isSelected?"rgba(255,255,255,0.3)":u?.color||"#94a3b8",fontSize:"9px"}} className="px-1 rounded text-white truncate mb-0.5">{u?.initials}</div>;})}
                {abs.length>2&&<div className={isSelected?"text-blue-100 text-xs":"text-slate-400 text-xs"}>+{abs.length-2}</div>}
              </div>
            );
          })}
        </div>
      </div>
      {sel&&(
        <div className="mt-4 bg-white rounded-2xl border border-slate-200 p-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h3 className="font-semibold text-slate-700">{fmtDate(sel.ds)}</h3>
              {sel.holiday&&<div className="text-xs text-red-500 font-medium">&#127477;&#127473; {sel.holiday}</div>}
            </div>
            <button onClick={()=>setSel(null)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
          </div>
          {sel.abs.length===0
            ? <div className="text-sm text-slate-400 text-center py-4">Brak urlopow w tym dniu</div>
            : (
              <div>
                <div className="text-xs text-slate-400 mb-2">Nieobecni: <strong className="text-slate-600">{sel.abs.length}</strong></div>
                <div className="space-y-2">
                  {sel.abs.map(r=>{
                    const u=users.find(x=>x.id===r.userId);const lt=getLT(r.type);const st=ST[r.status];
                    return (
                      <div key={r.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                        <Av u={u} sz={36}/>
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium text-slate-700">{u?.name}</div>
                          <div className="text-xs text-slate-400">{u?.team} · {lt?.label}</div>
                          <div className="text-xs text-slate-400">{fmtDate(r.dateFrom)}{r.dateTo!==r.dateFrom?" - "+fmtDate(r.dateTo):""} · {fmtDur(r)}</div>
                        </div>
                        {st&&<span className={"text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 "+st.cls}>{st.label}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )
          }
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// UWAGI PANEL
// ─────────────────────────────────────────────────────────────────────
function UwagiPanel({user,users,uwagi,onSubmit,onMarkRead,onDelete}){
  const [text,setText]=useState("");const [err,setErr]=useState("");
  const isAdmin=hasR(user,"administrator");
  const myUwagi=[...uwagi].filter(w=>w.userId===user.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const allUwagi=[...uwagi].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const unreadIds=uwagi.filter(w=>!w.readByAdmin).map(w=>w.id);
  useEffect(()=>{if(isAdmin&&unreadIds.length>0)onMarkRead(unreadIds);},[]);
  function submit(){
    if(!text.trim()){setErr("Wpisz tresc uwagi.");return;}
    onSubmit(text.trim());setText("");setErr("");
  }
  return (
    <div className="max-w-xl space-y-5">
      <div className="bg-white rounded-2xl p-5 border border-slate-200">
        <h2 className="text-sm font-semibold text-slate-700 mb-1">Wyslij uwage do administratora</h2>
        <p className="text-xs text-slate-400 mb-3">Administrator otrzyma powiadomienie o Twojej uwadze.</p>
        <textarea value={text} onChange={e=>{setText(e.target.value);setErr("");}} rows={4} placeholder="Wpisz swoja uwage, sugestie lub problem..." className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:border-blue-400 mb-2"/>
        {err&&<div className="text-xs text-red-500 mb-2">{err}</div>}
        <button onClick={submit} disabled={!text.trim()} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white font-medium py-2.5 rounded-xl text-sm">Wyslij uwage</button>
      </div>
      {isAdmin&&(
        <div>
          <h2 className="text-sm font-semibold text-slate-600 mb-3">Wszystkie uwagi <Badge n={allUwagi.length}/></h2>
          {allUwagi.length===0
            ? <Empty msg="Brak uwag"/>
            : (
              <div className="space-y-2">
                {allUwagi.map(w=>{
                  const sender=users.find(u=>u.id===w.userId);
                  return (
                    <div key={w.id} className={"bg-white rounded-xl p-4 border "+(w.readByAdmin?"border-slate-200":"border-blue-300 bg-blue-50")}>
                      <div className="flex items-start gap-3">
                        <Av u={sender} sz={36}/>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-sm font-medium text-slate-700">{sender?.name}</span>
                            <span className="text-xs text-slate-400">{sender?.team}</span>
                            <span className="text-xs text-slate-300">{fmtDate(w.createdAt)}</span>
                            {!w.readByAdmin&&<span className="text-xs bg-blue-500 text-white px-1.5 py-0.5 rounded-full">Nowe</span>}
                          </div>
                          <p className="text-sm text-slate-600 mt-1 leading-relaxed">{w.text}</p>
                        </div>
                        <button onClick={()=>onDelete(w.id)} className="text-slate-300 hover:text-red-500 font-bold flex-shrink-0 ml-2">✕</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )
          }
        </div>
      )}
      {!isAdmin&&myUwagi.length>0&&(
        <div>
          <h2 className="text-sm font-semibold text-slate-600 mb-3">Moje wyslane uwagi <Badge n={myUwagi.length}/></h2>
          <div className="space-y-2">
            {myUwagi.map(w=>(
              <div key={w.id} className="bg-white rounded-xl p-4 border border-slate-200 flex items-start gap-3">
                <span className="text-xl flex-shrink-0 mt-0.5">💬</span>
                <div className="flex-1 min-w-0">
                  <p className="text-sm text-slate-600 leading-relaxed">{w.text}</p>
                  <div className="text-xs text-slate-400 mt-1">{fmtDate(w.createdAt)}</div>
                </div>
                <button onClick={()=>onDelete(w.id)} className="text-slate-300 hover:text-red-500 font-bold flex-shrink-0">✕</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// SHARED COMPONENTS
// ─────────────────────────────────────────────────────────────────────
function RCard({req,users,onCancel,onDelete}){
  const lt=getLT(req.type);
  const st=ST[req.status]||{};
  const reqUser=users?users.find(u=>u.id===req.userId):null;
  const approver=users&&req.mgrId?users.find(u=>u.id===req.mgrId):null;
  const wasApproved=approver&&req.status!=="odrzucony";
  const wasRejected=approver&&req.status==="odrzucony";
  return (
    <div className="bg-white rounded-xl p-4 border border-slate-200 flex items-start gap-3">
      {reqUser&&<Av u={reqUser} sz={32}/>}
      <span className="text-xl mt-0.5">{st.icon}</span>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          {reqUser&&<span className="text-sm font-medium text-slate-700">{reqUser.name} ·</span>}
          <span className="text-sm text-slate-700">{lt?.label}</span>
          <span className={"text-xs px-2 py-0.5 rounded-full font-medium "+st.cls}>{st.label}</span>
        </div>
        <div className="text-xs text-slate-500 mt-0.5">{fmtDate(req.dateFrom)}{req.dateTo&&req.dateTo!==req.dateFrom?" - "+fmtDate(req.dateTo):""} · {fmtDur(req)}</div>
        {req.reason&&<div className="text-xs text-slate-400 truncate">{req.reason}</div>}
        {wasApproved&&(
          <div className="text-xs text-green-700 bg-green-50 rounded px-2 py-0.5 mt-1">
            Zaakceptowane przez <strong>{approver.name}</strong>{req.mgrCmt?" · "+req.mgrCmt:""}
          </div>
        )}
        {wasRejected&&(
          <div className="text-xs text-red-600 bg-red-50 rounded px-2 py-0.5 mt-1">
            Odrzucone przez <strong>{approver.name}</strong>{req.mgrCmt?" · "+req.mgrCmt:""}
          </div>
        )}
        {!approver&&req.mgrCmt&&<div className="text-xs text-green-600 bg-green-50 rounded px-2 py-0.5 mt-1">{req.mgrCmt}</div>}
      </div>
      <div className="flex-shrink-0 flex flex-col items-end gap-1.5">
        <div className="text-xs text-slate-300">{fmtDate(req.createdAt)}</div>
        {onCancel&&<button onClick={()=>onCancel(req)} className="text-xs text-orange-400 hover:text-orange-600 underline">Wycofaj</button>}
        {onDelete&&<button onClick={onDelete} className="text-xs text-red-400 hover:text-red-600 underline">Usun</button>}
      </div>
    </div>
  );
}

function Av({u,sz}){const s=(sz||32)+"px",fs=(sz||32)<=32?"10px":"12px";if(!u)return <div style={{width:s,height:s}} className="rounded-full bg-slate-200 flex-shrink-0"/>;return <div style={{width:s,height:s,background:u.color,fontSize:fs}} className="rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">{u.initials}</div>;}
function FI({label,val,set,ph}){return <div><label className="text-xs font-medium text-slate-500 block mb-1.5">{label}</label><input type="text" value={val} onChange={e=>set(e.target.value)} placeholder={ph} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>;}
function Badge({n}){if(!n||n<=0)return null;return <span className="inline-flex items-center justify-center w-5 h-5 text-xs font-bold bg-blue-100 text-blue-600 rounded-full ml-1">{n}</span>;}
function Empty({msg}){return <div className="bg-white rounded-xl p-6 text-center text-sm text-slate-400 border border-slate-200">{msg}</div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
